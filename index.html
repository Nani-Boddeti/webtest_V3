<!DOCTYPE html>
<html lang="en">
<head>

      </a>

      <!-- Hamburger toggle -->
      <button class="header__hamburger" id="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
        <span class="header__hamburger-line"></span>
        <span class="header__hamburger-line"></span>
        <span class="header__hamburger-line"></span>
      </button>

      <!-- Navigation links -->
      <nav class="header__nav" id="main-nav" role="navigation" aria-label="Main navigation">
        <ul class="header__nav-list">
          <li class="header__nav-item">
            <a href="#/" class="header__nav-link" data-route="home">Home</a>

          <li class="header__nav-item">

          </li>
        </ul>
      </nav>

  <main id="main-content" class="main">
    <div class="main__container">
      <div id="app" class="app">
        <!-- Loading state -->
        <div class="loading" id="loading">
          <div class="loading__spinner"></div>
          <p class="loading__text">Loading beauty tips...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer__container">
      <p class="footer__text">Clean Beauty Tips &mdash; Empowering your natural beauty journey</p>
      <p class="footer__credit">Built with &hearts; for a cleaner, greener world</p>
