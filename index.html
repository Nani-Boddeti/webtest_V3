  <!-- html2pdf (loaded on demand via JS) -->

  <style>
    /* ===== CSS Custom Properties (Design Tokens) ===== */
    :root {
      --gold: #C9A84C;
      --gold2: #E5C158;
      --gold-light: rgba(201, 168, 76, 0.12);
      --gold-glow: rgba(201, 168, 76, 0.25);
      --dark: #1a1a1a;
      --dark2: #2a2a2a;
      --dark3: #3a3a3a;
      --light: #f9f7f4;
      --light2: #f0ede7;
      --text: #1a1a1a;
      --text-light: #6b6b6b;
      --white: #ffffff;
      --font-heading: 'Lora', 'Georgia', 'Times New Roman', serif;
      --font-body: 'Open Sans', 'Helvetica Neue', 'Arial', sans-serif;
      --max-width: 960px;
      --avatar-size: 200px;
      --skill-bar-height: 12px;
      --skill-bar-radius: 6px;
      --section-padding: 40px 0;
      --base-font-size: 16px;
      --base-line-height: 1.6;
      --transition-smooth: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.06);
      --shadow-hover: 0 8px 40px rgba(0, 0, 0, 0.10);
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 20px;
    }

    /* ===== Reset & Base ===== */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      font-size: var(--base-font-size);
      line-height: var(--base-line-height);
    }

    body {
      font-family: var(--font-body);
      color: var(--text);
      background-color: var(--light);
      font-size: var(--base-font-size);
      line-height: var(--base-line-height);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ===== Focus & Accessibility ===== */
    a:focus-visible,
    button:focus-visible,
    [tabindex]:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 3px;
      border-radius: var(--radius-sm);
    }

    a {
      color: var(--gold);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    a:hover {
      color: var(--gold2);
      text-decoration: underline;
    }

    /* ===== Skip Link ===== */
    .skip-link {
      position: absolute;
      top: -100%;
      left: 50%;
      transform: translateX(-50%);
      background: var(--gold);
      color: var(--white);
      padding: 0.75rem 1.5rem;
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
      font-weight: 600;
      z-index: 10000;
      transition: top 0.3s ease;
    }

    .skip-link:focus {
      top: 0;
    }

    /* ===== Container ===== */
    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ===== Screen Reader Only ===== */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ===== Typography ===== */
    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-heading);
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
    }

    h2 {
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      position: relative;
      display: inline-block;
    }

    h2::after {
      content: '';
      display: block;
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, var(--gold), var(--gold2));
      margin-top: 8px;
      border-radius: 2px;
    }

    h3 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    h4 {
      font-size: 1.05rem;
      font-weight: 600;
    }

    /* ===== Buttons ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 600;
      padding: 12px 28px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.3s var(--transition-smooth);
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: var(--white);
      box-shadow: 0 4px 14px var(--gold-glow);
    }

    .btn-primary:hover,
    .btn-primary:focus-visible {
      background: linear-gradient(135deg, var(--gold2), var(--gold));
      box-shadow: 0 6px 24px var(--gold-glow);
      transform: translateY(-2px);
      text-decoration: none;
      color: var(--white);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: transparent;
      color: var(--gold);
      border: 2px solid var(--gold);
    }

    .btn-secondary:hover,
    .btn-secondary:focus-visible {
      background: var(--gold);
      color: var(--white);
      text-decoration: none;
    }

    /* ===== Header / Hero ===== */
    .cv-header {
      background: linear-gradient(160deg, var(--dark) 0%, #0d0d0d 100%);
      color: var(--white);
      padding: 60px 0 50px;
      position: relative;
      overflow: hidden;
    }

    .cv-header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(ellipse at 80% 20%, rgba(201, 168, 76, 0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    .header-inner {
      display: flex;
      align-items: center;
      gap: 40px;
      position: relative;
      z-index: 1;
    }

    .avatar-wrapper {
      flex-shrink: 0;
    }

    .avatar {
      width: var(--avatar-size);
      height: var(--avatar-size);
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--gold);
      box-shadow: 0 0 40px rgba(201, 168, 76, 0.2);
      background: var(--dark2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-heading);
      font-size: 4rem;
      font-weight: 700;
      color: var(--gold);
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--dark2), var(--dark3));
    }

    .header-info {
      flex: 1;
      min-width: 0;
    }

    .header-info h1 {
      margin-bottom: 0.25rem;
      color: var(--white);
    }

    .header-info .title {
      font-family: var(--font-heading);
      font-size: 1.2rem;
      color: var(--gold);
      font-style: italic;
      margin-bottom: 0.75rem;
    }

    .header-info .summary {
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.95rem;
      line-height: 1.7;
      max-width: 580px;
    }

    .contact-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 28px;
      margin-top: 16px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.7);
    }

    .contact-bar a {
      color: var(--gold2);
    }

    .contact-bar a:hover {
      color: var(--gold);
    }

    .contact-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .contact-item svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* ===== Toolbar ===== */
    .toolbar {
      background: var(--white);
      border-bottom: 1px solid var(--light2);
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
      background: rgba(255, 255, 255, 0.92);
    }

    .toolbar-inner {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
    }

    /* ===== Sections ===== */
    section {
      padding: var(--section-padding);
    }

    .section-card {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 36px 40px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-card);
      transition: box-shadow 0.3s ease;
    }

    .section-card:hover {
      box-shadow: var(--shadow-hover);
    }

    /* ===== Skills ===== */
    .skills-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 40px;
    }

    .skill-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .skill-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .skill-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .skill-level {
      font-size: 0.85rem;
      color: var(--text-light);
      font-weight: 600;
    }

    .skill-bar {
      width: 100%;
      height: var(--skill-bar-height);
      background: var(--light2);
      border-radius: var(--skill-bar-radius);
      overflow: hidden;
    }

    .skill-bar-fill {
      height: 100%;
      border-radius: var(--skill-bar-radius);
      background: linear-gradient(90deg, var(--gold), var(--gold2));
      width: 0%;
      transition: width 1s var(--transition-smooth);
      position: relative;
    }

    .skill-bar-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      border-radius: var(--skill-bar-radius);
    }

    .skill-bar-fill.animated {
      /* width is set via JS */
    }

    /* ===== Experience ===== */
    .experience-item {
      padding: 24px 0;
      border-bottom: 1px solid var(--light2);
    }

    .experience-item:first-child {
      padding-top: 0;
    }

    .experience-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .exp-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 6px;
    }

    .exp-company {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .exp-position {
      font-family: var(--font-heading);
      font-style: italic;
      color: var(--gold);
      font-size: 0.95rem;
    }

    .exp-date {
      font-size: 0.85rem;
      color: var(--text-light);
      font-weight: 600;
      white-space: nowrap;
    }

    .exp-description {
      font-size: 0.9rem;
      color: var(--text-light);
      line-height: 1.7;
      margin-top: 6px;
    }

    /* ===== Education ===== */
    .edu-item {
      padding: 18px 0;
      border-bottom: 1px solid var(--light2);
    }

    .edu-item:first-child {
      padding-top: 0;
    }

    .edu-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .edu-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 4px;
    }

    .edu-institution {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .edu-degree {
      font-size: 0.9rem;
      color: var(--text-light);
    }

    .edu-honors {
      font-size: 0.85rem;
      color: var(--gold);
      font-style: italic;
      font-weight: 600;
      margin-top: 2px;
    }

    /* ===== Certifications ===== */
    .certs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .cert-item {
      background: var(--light);
      padding: 18px 20px;
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--gold);
    }

    .cert-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .cert-issuer {
      font-size: 0.85rem;
      color: var(--text-light);
    }

    /* ===== Languages & Interests ===== */
    .languages-interests {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }

    .lang-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--light2);
    }

    .lang-name {
      font-weight: 600;
    }

    .lang-level {
      font-size: 0.85rem;
      color: var(--gold);
      font-weight: 600;
    }

    .interests-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .interest-tag {
      display: inline-block;
      background: var(--gold-light);
      color: var(--gold);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 999px;
      border: 1px solid transparent;
      transition: all 0.3s ease;
    }

    .interest-tag:hover {
      background: var(--gold);
      color: var(--white);
      border-color: var(--gold);
    }

    /* ===== Footer ===== */
    .cv-footer {
      background: var(--dark);
      color: rgba(255, 255, 255, 0.6);
      text-align: center;
      padding: 32px 0;
      font-size: 0.85rem;
    }

    .cv-footer .social-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 12px;
    }

    .cv-footer .social-links a {
      color: var(--gold);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .cv-footer .social-links a:hover {
      color: var(--gold2);
    }

    /* ===== Print Styles ===== */
    @media print {
      body {
        background: white;
        font-size: 12pt;
        color: black;
      }

      .toolbar {
        display: none !important;
      }

      .cv-header {
        background: white !important;
        color: black !important;
        padding: 30px 0 20px !important;
      }

      .header-info h1 {
        color: black !important;
      }

      .header-info .title {
        color: #C9A84C !important;
      }

      .header-info .summary {
        color: #333 !important;
      }

      .contact-bar {
        color: #555 !important;
      }

      .section-card {
        box-shadow: none !important;
        border: 1px solid #ddd;
        break-inside: avoid;
        padding: 24px 28px;
      }

      .avatar {
        border-color: #C9A84C !important;
        box-shadow: none !important;
      }

      .skill-bar-fill {
        /* Force full width for print — will be set via JS before print */
        background: #C9A84C !important;
      }

      .skill-bar {
        background: #eee !important;
        border: 1px solid #ddd;
      }

      .experience-item {
        break-inside: avoid;
      }

      a {
        color: black !important;
        text-decoration: none !important;
      }

      .cv-footer {
        background: none !important;
        color: #555 !important;
        border-top: 1px solid #ddd;
      }

      .interest-tag {
        background: #f5f5f5 !important;
        color: #333 !important;
        border: 1px solid #ddd;
      }

      h2::after {
        background: #C9A84C !important;
      }
    }

    /* ===== Responsive ===== */
    @media (max-width: 860px) {
      .header-inner {
        flex-direction: column;
        text-align: center;
        gap: 24px;
      }

      .header-info .summary {
        max-width: 100%;
        margin-left: auto;
        margin-right: auto;
      }

      .contact-bar {
        justify-content: center;
      }

      .skills-grid {
        grid-template-columns: 1fr;
      }

      .certs-grid {
        grid-template-columns: 1fr;
      }

      .languages-interests {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .section-card {
        padding: 28px 24px;
      }

      :root {
        --avatar-size: 160px;
      }

      .header-info h1 {
        font-size: 2rem;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 0 16px;
      }

      .section-card {
        padding: 20px 16px;
      }

      :root {
        --avatar-size: 130px;
      }

      h1 {
        font-size: 1.75rem;
      }

      h2 {
        font-size: 1.4rem;
      }

      .exp-header {
        flex-direction: column;
      }

      .btn {
        padding: 10px 20px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <!-- Skip Navigation -->
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <!-- ===== HEADER ===== -->
  <header class="cv-header" role="banner">
    <div class="container">
      <div class="header-inner">
        <div class="avatar-wrapper">
          <div class="avatar" id="avatar-container" role="img" aria-label="Portrait of Alexander James Harrington">
            <!-- Avatar image will be loaded from JSON if available, otherwise placeholder initials -->
            <div class="avatar-placeholder" id="avatar-placeholder" aria-hidden="true">AH</div>
          </div>
        </div>
        <div class="header-info">
          <h1 id="person-name">Alexander James Harrington</h1>
          <p class="title" id="person-title">Luxury Brand Strategist &amp; Creative Director</p>
          <p class="summary" id="person-summary">Loading...</p>
          <div class="contact-bar" id="contact-bar"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== TOOLBAR ===== -->
  <nav class="toolbar" aria-label="Page tools">
    <div class="container toolbar-inner">
      <button class="btn btn-primary" id="download-pdf" type="button" aria-label="Download CV as PDF">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Download PDF
      </button>
    </div>
  </nav>

  <!-- ===== MAIN CONTENT ===== -->
  <main id="main-content">

    <!-- Skills -->
    <section id="skills-section" aria-labelledby="skills-heading">
      <div class="container">
        <div class="section-card">
          <h2 id="skills-heading">Expertise &amp; Skills</h2>
          <div class="skills-grid" id="skills-grid" role="list" aria-label="Professional skills with proficiency levels"></div>
        </div>
      </div>
    </section>

    <!-- Experience -->
    <section id="experience-section" aria-labelledby="experience-heading">
      <div class="container">
        <div class="section-card">
          <h2 id="experience-heading">Professional Experience</h2>
          <div id="experience-list" role="list" aria-label="Work experience history"></div>
        </div>
      </div>
    </section>

    <!-- Education -->
    <section id="education-section" aria-labelledby="education-heading">
      <div class="container">
        <div class="section-card">
          <h2 id="education-heading">Education</h2>
          <div id="education-list" role="list" aria-label="Educational background"></div>
        </div>
      </div>
    </section>

    <!-- Certifications -->
    <section id="certifications-section" aria-labelledby="certifications-heading">
      <div class="container">
        <div class="section-card">
          <h2 id="certifications-heading">Certifications</h2>
          <div class="certs-grid" id="certs-grid" role="list" aria-label="Professional certifications"></div>
        </div>
      </div>
    </section>

    <!-- Languages & Interests -->
    <section id="languages-section" aria-labelledby="languages-heading">
      <div class="container">
        <div class="section-card">
          <h2 id="languages-heading">Languages &amp; Interests</h2>
          <div class="languages-interests">
            <div>
              <h3 id="languages-subheading">Languages</h3>
              <div id="languages-list" role="list" aria-labelledby="languages-subheading"></div>
            </div>
            <div>
              <h3 id="interests-subheading">Interests</h3>
              <div id="interests-list" role="list" aria-labelledby="interests-subheading"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="cv-footer" role="contentinfo">
    <div class="container">
      <div class="social-links" id="social-links"></div>
      <p>&copy; <span id="current-year"></span> <span id="footer-name">Alexander James Harrington</span>. All rights reserved.</p>
    </div>
  </footer>

  <script>
    (function() {
      'use strict';

      // ===== Load CV Data =====
      let cvData = null;

      function escapeHtml(str) {
        if (!str) return '';
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function fetchData() {
        return fetch('cv-data.json')
          .then(function(res) {
            if (!res.ok) throw new Error('Failed to load CV data (HTTP ' + res.status + ')');
            return res.json();
          })
          .then(function(data) {
            cvData = data;
            renderAll(data);
            setupFavicon(data);
            setupPDFDownload(data);
            setupSkillBarObserver();
            return data;
          })
          .catch(function(err) {
            console.error('CV Data Error:', err);
            document.getElementById('person-summary').textContent = 'Failed to load CV data. Please check the console for details.';
          });
      }

      // ===== Render All Sections =====
      function renderAll(data) {
        renderHeader(data);
        renderSkills(data);
        renderExperience(data);
        renderEducation(data);
        renderCertifications(data);
        renderLanguages(data);
        renderInterests(data);
        renderFooter(data);
        document.getElementById('current-year').textContent = new Date().getFullYear();
      }

      // ===== Header =====
      function renderHeader(data) {
        var p = data.person;
        document.getElementById('person-name').textContent = p.name;
        document.getElementById('person-title').textContent = p.title;
        document.getElementById('person-summary').textContent = p.summary;

        // Avatar
        var container = document.getElementById('avatar-container');
        var placeholder = document.getElementById('avatar-placeholder');
        if (p.avatar && p.avatar.trim() !== '') {
          var img = document.createElement('img');
          img.src = p.avatar;
          img.alt = 'Portrait of ' + p.name;
          img.loading = 'lazy';
          placeholder.style.display = 'none';
          container.appendChild(img);
        } else {
          placeholder.textContent = p.initials || p.name.split(' ').map(function(n) { return n[0]; }).join('').slice(0, 2);
        }

        // Contact bar
        var contactBar = document.getElementById('contact-bar');
        contactBar.innerHTML = '';

        var contacts = [
          { icon: 'mail', label: 'Email', href: 'mailto:' + p.email, text: p.email },
          { icon: 'phone', label: 'Phone', href: 'tel:' + p.phone.replace(/[^+\d]/g, ''), text: p.phone },
          { icon: 'location', label: 'Location', href: null, text: p.location },
          { icon: 'website', label: 'Website', href: p.website, text: p.website.replace(/^https?:\/\//, '') }
        ];

        contacts.forEach(function(c) {
          var el = document.createElement('span');
          el.className = 'contact-item';
          el.setAttribute('role', 'listitem');

          var svgMarkup = '';
          if (c.icon === 'mail') {
            svgMarkup = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6zm-2 0l-8 5-8-5h16zm0 12H4V8l8 5 8-5v10z"/></svg>';
          } else if (c.icon === 'phone') {
            svgMarkup = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';
          } else if (c.icon === 'location') {
            svgMarkup = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';
          } else if (c.icon === 'website') {
            svgMarkup = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>';
          }

          el.innerHTML = svgMarkup;

          if (c.href) {
            var a = document.createElement('a');
            a.href = c.href;
            a.textContent = c.text;
            a.setAttribute('aria-label', c.label + ': ' + c.text);
            el.appendChild(a);
          } else {
            var span = document.createElement('span');
            span.textContent = c.text;
            el.appendChild(span);
          }

          contactBar.appendChild(el);
        });
      }

      // ===== Skills =====
      function renderSkills(data) {
        var grid = document.getElementById('skills-grid');
        grid.innerHTML = '';
        data.skills.forEach(function(skill) {
          var item = document.createElement('div');
          item.className = 'skill-item';
          item.setAttribute('role', 'listitem');

          var header = document.createElement('div');
          header.className = 'skill-header';

          var nameSpan = document.createElement('span');
          nameSpan.className = 'skill-name';
          nameSpan.textContent = skill.name;

          var levelSpan = document.createElement('span');
          levelSpan.className = 'skill-level';
          levelSpan.textContent = skill.level + '%';

          header.appendChild(nameSpan);
          header.appendChild(levelSpan);

          var bar = document.createElement('div');
          bar.className = 'skill-bar';
          bar.setAttribute('role', 'progressbar');
          bar.setAttribute('aria-valuenow', '0');
          bar.setAttribute('aria-valuemin', '0');
          bar.setAttribute('aria-valuemax', '100');
          bar.setAttribute('aria-label', skill.name + ': ' + skill.level + '%');

          var fill = document.createElement('div');
          fill.className = 'skill-bar-fill';
          fill.dataset.level = skill.level;
          fill.setAttribute('aria-hidden', 'true');

          bar.appendChild(fill);
          item.appendChild(header);
          item.appendChild(bar);
          grid.appendChild(item);
        });
      }

      // ===== Experience =====
      function renderExperience(data) {
        var list = document.getElementById('experience-list');
        list.innerHTML = '';
        data.experience.forEach(function(exp) {
          var item = document.createElement('div');
          item.className = 'experience-item';
          item.setAttribute('role', 'listitem');

          var header = document.createElement('div');
          header.className = 'exp-header';

          var infoDiv = document.createElement('div');
          var companySpan = document.createElement('div');
          companySpan.className = 'exp-company';
          companySpan.textContent = exp.company;

          var posSpan = document.createElement('div');
          posSpan.className = 'exp-position';
          posSpan.textContent = exp.position;

          infoDiv.appendChild(companySpan);
          infoDiv.appendChild(posSpan);

          var dateSpan = document.createElement('span');
          dateSpan.className = 'exp-date';
          dateSpan.textContent = exp.startDate + ' — ' + exp.endDate;

          header.appendChild(infoDiv);
          header.appendChild(dateSpan);

          var desc = document.createElement('p');
          desc.className = 'exp-description';
          desc.textContent = exp.description;

          item.appendChild(header);
          item.appendChild(desc);
          list.appendChild(item);
        });
      }

      // ===== Education =====
      function renderEducation(data) {
        var list = document.getElementById('education-list');
        list.innerHTML = '';
        data.education.forEach(function(edu) {
          var item = document.createElement('div');
          item.className = 'edu-item';
          item.setAttribute('role', 'listitem');

          var header = document.createElement('div');
          header.className = 'edu-header';

          var instSpan = document.createElement('span');
          instSpan.className = 'edu-institution';
          instSpan.textContent = edu.institution;

          var yearSpan = document.createElement('span');
          yearSpan.className = 'exp-date';
          yearSpan.textContent = edu.year;

          header.appendChild(instSpan);
          header.appendChild(yearSpan);

          var degreeSpan = document.createElement('div');
          degreeSpan.className = 'edu-degree';
          degreeSpan.textContent = edu.degree;

          item.appendChild(header);
          item.appendChild(degreeSpan);

          if (edu.honors) {
            var honorsSpan = document.createElement('div');
            honorsSpan.className = 'edu-honors';
            honorsSpan.textContent = edu.honors;
            item.appendChild(honorsSpan);
          }

          list.appendChild(item);
        });
      }

      // ===== Certifications =====
      function renderCertifications(data) {
        var grid = document.getElementById('certs-grid');
        grid.innerHTML = '';
        data.certifications.forEach(function(cert) {
          var item = document.createElement('div');
          item.className = 'cert-item';
          item.setAttribute('role', 'listitem');

          var nameSpan = document.createElement('div');
          nameSpan.className = 'cert-name';
          nameSpan.textContent = cert.name;

          var issuerSpan = document.createElement('div');
          issuerSpan.className = 'cert-issuer';
          issuerSpan.textContent = cert.issuer + ' · ' + cert.year;

          item.appendChild(nameSpan);
          item.appendChild(issuerSpan);
          grid.appendChild(item);
        });
      }

      // ===== Languages =====
      function renderLanguages(data) {
        var list = document.getElementById('languages-list');
        list.innerHTML = '';
        data.languages.forEach(function(lang) {
          var item = document.createElement('div');
          item.className = 'lang-item';
          item.setAttribute('role', 'listitem');

          var nameSpan = document.createElement('span');
          nameSpan.className = 'lang-name';
          nameSpan.textContent = lang.name;

          var levelSpan = document.createElement('span');
          levelSpan.className = 'lang-level';
          levelSpan.textContent = lang.level;

          item.appendChild(nameSpan);
          item.appendChild(levelSpan);
          list.appendChild(item);
        });
      }

      // ===== Interests =====
      function renderInterests(data) {
        var list = document.getElementById('interests-list');
        list.innerHTML = '';
        data.interests.forEach(function(interest) {
          var tag = document.createElement('span');
          tag.className = 'interest-tag';
          tag.textContent = interest;
          tag.setAttribute('role', 'listitem');
          list.appendChild(tag);
        });
      }

      // ===== Footer =====
      function renderFooter(data) {
        document.getElementById('footer-name').textContent = data.person.name;

        var socialLinks = document.getElementById('social-links');
        socialLinks.innerHTML = '';
        var social = data.social;
        if (social) {
          Object.keys(social).forEach(function(key) {
            var a = document.createElement('a');
            a.href = social[key];
            a.textContent = key.charAt(0).toUpperCase() + key.slice(1);
            a.setAttribute('aria-label', key + ' profile');
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            socialLinks.appendChild(a);
          });
        }
      }

      // ===== Skill Bar Animation (IntersectionObserver) =====
      function setupSkillBarObserver() {
        var fills = document.querySelectorAll('.skill-bar-fill');
        if (fills.length === 0) return;

        var observer = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) {
              var fill = entry.target;
              var level = parseInt(fill.dataset.level, 10);
              if (!isNaN(level)) {
                // Small delay for staggered effect
                var delay = Array.from(fills).indexOf(fill) * 60;
                setTimeout(function() {
                  fill.style.width = level + '%';
                  // Update ARIA value
                  var bar = fill.closest('.skill-bar');
                  if (bar) {
                    bar.setAttribute('aria-valuenow', level);
                  }
                }, delay);
              }
              observer.unobserve(fill);
            }
          });
        }, { threshold: 0.1 });

        fills.forEach(function(fill) {
          observer.observe(fill);
        });

        // Store for potential reuse (e.g., after PDF generation)
        window.__skillObserver = observer;
        window.__skillFills = fills;
      }

      // ===== PDF Download =====
      function setupPDFDownload(data) {
        var btn = document.getElementById('download-pdf');
        btn.addEventListener('click', function() {
          btn.disabled = true;
          btn.textContent = 'Generating PDF…';

          // Temporarily force skill bars to full width for PDF capture
          var fills = document.querySelectorAll('.skill-bar-fill');
          var originalStyles = [];
          fills.forEach(function(fill, i) {
            originalStyles[i] = fill.style.width;
            var level = parseInt(fill.dataset.level, 10);
            if (!isNaN(level)) {
              fill.style.width = level + '%';
            }
          });

          // Also fix ARIA values
          var bars = document.querySelectorAll('.skill-bar');
          bars.forEach(function(bar) {
            var fill = bar.querySelector('.skill-bar-fill');
            if (fill && fill.dataset.level) {
              bar.setAttribute('aria-valuenow', fill.dataset.level);
            }
          });

          loadHTML2PDF(function() {
            var element = document.getElementById('main-content');
            var opt = {
              margin:       [0.4, 0.4, 0.4, 0.4],
              filename:     'Alexander_Harrington_CV.pdf',
              image:        { type: 'jpeg', quality: 0.92 },
              html2canvas:  { scale: 2, useCORS: true, letterRendering: true, logging: false },
              jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' },
              pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
            };

            // Also capture header
            var header = document.querySelector('.cv-header').cloneNode(true);
            // We'll use html2pdf on the full body content

            html2pdf().set(opt).from(element).save().then(function() {
              // Restore original skill bar widths
              fills.forEach(function(fill, i) {
                fill.style.width = originalStyles[i] || '0%';
              });
              btn.disabled = false;
              btn.innerHTML =
                '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Download PDF';
            }).catch(function(err) {
              console.error('PDF generation failed:', err);
              // Restore
              fills.forEach(function(fill, i) {
                fill.style.width = originalStyles[i] || '0%';
              });
              btn.disabled = false;
              btn.innerHTML =
                '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Download PDF';
              alert('PDF download failed. Please check the console for details.');
            });
          });
        });
      }

      function loadHTML2PDF(callback) {
        if (typeof html2pdf !== 'undefined') {
          callback();
          return;
        }

        var script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
        script.integrity = 'sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==';
        script.crossOrigin = 'anonymous';
        script.referrerPolicy = 'no-referrer';
        script.onload = callback;
        script.onerror = function() {
          console.error('Failed to load html2pdf.js');
          alert('Failed to load PDF library. Please check your internet connection.');
          var btn = document.getElementById('download-pdf');
          btn.disabled = false;
          btn.innerHTML =
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Download PDF';
        };
        document.head.appendChild(script);
      }

      // ===== Dynamic Favicon via Canvas =====
      function setupFavicon(data) {
        try {
          var p = data.person;
          var initials = p.initials || p.name.split(' ').map(function(n) { return n[0]; }).join('').slice(0, 2);
          var canvas = document.createElement('canvas');
          canvas.width = 64;
          canvas.height = 64;
          var ctx = canvas.getContext('2d');

          // Background
          ctx.beginPath();
          ctx.roundRect(0, 0, 64, 64, 12);
          ctx.fillStyle = '#C9A84C';
          ctx.fill();

          // Text
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 28px Lora, Georgia, serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(initials, 32, 34);

          var dataUrl = canvas.toDataURL('image/png');
          var link = document.getElementById('dynamic-favicon') || document.querySelector('link[rel="icon"]');
          if (link) {
            link.href = dataUrl;
          } else {
            link = document.createElement('link');
            link.rel = 'icon';
            link.href = dataUrl;
            document.head.appendChild(link);
          }

          // Also set apple-touch-icon
          var appleLink = document.querySelector('link[rel="apple-touch-icon"]');
          if (!appleLink) {
            appleLink = document.createElement('link');
            appleLink.rel = 'apple-touch-icon';
            document.head.appendChild(appleLink);
          }
          appleLink.href = dataUrl;
        } catch (e) {
          console.warn('Favicon generation failed, using SVG fallback:', e);
        }
      }

      // ===== Init =====
      if (typeof window !== 'undefined') {
        document.addEventListener('DOMContentLoaded', fetchData);
      }
    })();
  </script>
