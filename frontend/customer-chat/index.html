<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Service - Chat</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; height: 100vh; display: flex; justify-content: center; align-items: center; }
.chat-container { width: 400px; max-width: 100%; height: 600px; max-height: 100vh; background: white; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.12); display: flex; flex-direction: column; overflow: hidden; }
.chat-header { background: #1a73e8; color: white; padding: 16px 20px; }
.chat-header h2 { font-size: 18px; }
.chat-header p { font-size: 13px; opacity: 0.9; margin-top: 4px; }
.messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.message { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; }
.message.user { background: #1a73e8; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
.message.bot { background: #f0f2f5; color: #1a1a1a; align-self: flex-start; border-bottom-left-radius: 4px; }
.message.system { background: #fff3cd; color: #856404; align-self: center; text-align: center; font-size: 13px; max-width: 90%; }
.booking-card { background: #e8f0fe; border-radius: 12px; padding: 12px; margin-top: 8px; }
.booking-card h4 { color: #1a73e8; margin-bottom: 6px; }
.booking-card p { font-size: 13px; margin: 2px 0; }
.input-area { border-top: 1px solid #e0e0e0; padding: 12px 16px; display: flex; gap: 8px; }
.input-area input { flex: 1; border: 1px solid #ddd; border-radius: 24px; padding: 10px 16px; font-size: 14px; outline: none; }
.input-area input:focus { border-color: #1a73e8; }
.input-area button { background: #1a73e8; color: white; border: none; border-radius: 24px; padding: 10px 20px; font-size: 14px; cursor: pointer; }
.input-area button:hover { background: #1557b0; }
.session-badge { font-size: 11px; color: #666; text-align: center; padding: 4px; }
.typing { display: flex; gap: 4px; padding: 10px 14px; }
.typing span { width: 8px; height: 8px; background: #999; border-radius: 50%; animation: typing 1.4s infinite ease-in-out; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typing { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
</style>
</head>
<body>
<div class="chat-container">
  <div class="chat-header">
    <h2>💬 Booking Assistant</h2>
    <p>Chat to book, cancel, or check availability</p>
  </div>
  <div class="messages" id="messages">
    <div class="message bot">👋 Hello! I'm your booking assistant. How can I help you today?</div>
  </div>
  <div class="session-badge" id="sessionBadge">Session active</div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="Type your message..." autofocus>
    <button id="sendBtn">Send</button>
  </div>
</div>
<script>
const API_BASE = window.location.origin.replace(/:\d+$/, '') + ':8000';
let sessionId = localStorage.getItem('chat_session_id');
if (!sessionId) {
  sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
  localStorage.setItem('chat_session_id', sessionId);
}

const messagesEl = document.getElementById('messages');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

function addMessage(text, role, booking = null) {
  const div = document.createElement('div');
  div.className = `message ${role}`;
  if (booking) {
    div.innerHTML = text + '<div class="booking-card"><h4>✅ Booking Confirmed</h4><p><strong>Ref:</strong> ' + booking.reference_id + '</p><p><strong>Service:</strong> ' + (booking.service_name || 'N/A') + '</p><p><strong>Date:</strong> ' + new Date(booking.appointment_start).toLocaleString() + '</p><p><strong>Status:</strong> ' + (booking.status || 'Confirmed') + '</p></div>';
  } else {
    div.textContent = text;
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'message bot typing';
  div.id = 'typingIndicator';
  div.innerHTML = '<span></span><span></span><span></span>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

async function sendMessage() {
  const text = userInput.value.trim();
  if (!text) return;
  userInput.value = '';
  addMessage(text, 'user');
  showTyping();

  try {
    const resp = await fetch(`${API_BASE}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: sessionId })
    });
    const data = await resp.json();
    hideTyping();
    addMessage(data.reply, 'bot', data.booking || null);
    if (data.is_fallback) {
      const fb = document.createElement('div');
      fb.className = 'message system';
      fb.textContent = '⚠️ Switching to simplified mode';
      messagesEl.appendChild(fb);
    }
  } catch (err) {
    hideTyping();
    addMessage('Sorry, I had trouble connecting. Please try again.', 'bot');
  }
}

sendBtn.addEventListener('click', sendMessage);
userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
</script>
</body>
</html>
